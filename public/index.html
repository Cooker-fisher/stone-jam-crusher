<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#15120d" />
    <title>STONE JAM CRUSHER｜石くだき工場</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="wrap">
      <canvas id="game" width="900" height="1000"></canvas>

      <div id="ui">
        <header id="hud">
          <div class="hazard"></div>
          <div class="row">
            <div class="money"><span class="coin">¥</span><strong id="money">0</strong></div>
            <div class="stat">解消 <b id="cleared">0</b></div>
          </div>
        </header>

        <div id="status" class="hidden"></div>

        <div id="bottom">
          <section id="shop">
            <button class="up" data-up="hammer">🔨 <em id="hammer-lv">Lv1</em> <i id="hammer-cost">¥30</i></button>
            <button class="up" data-up="worker">👷 <em id="worker-lv">0</em> <i id="worker-cost">¥90</i></button>
            <button class="up" data-up="jaw">⚙️ <em id="jaw-lv">Lv1</em> <i id="jaw-cost">¥60</i></button>
          </section>
          <footer id="tools">
            <button class="tool active" data-mode="hammer">🔨 ハンマー</button>
            <button class="tool" data-mode="chain">⛓ チェーン</button>
            <div class="hint" id="hint">詰まった岩をタップで砕け</div>
          </footer>
        </div>
      </div>

      <div id="loading">読み込み中…</div>
    </div>

    <script src="./vendor/matter.min.js"></script>
    <script src="./app.js?v=3"></script>
  </body>
</html>

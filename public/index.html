<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#2b2118" />
    <title>Stone Crusher Tycoon / 石くだき工場</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app">
      <header id="hud">
        <div class="money">
          <span class="coin">¥</span><strong id="money">0</strong>
        </div>
        <div class="rates">
          <div class="persec"><span id="perSec">0</span> /秒 自動</div>
          <div class="stone">投入中：<span id="stoneName">小石</span></div>
        </div>
      </header>

      <main id="stage">
        <canvas id="game"></canvas>
        <div id="tapHint">タップで砕く！</div>
      </main>

      <nav id="tabs">
        <button class="tab active" type="button" data-cat="設備">⚙️ 設備</button>
        <button class="tab" type="button" data-cat="人員">👷 人員</button>
      </nav>

      <section id="shop" aria-label="upgrades"></section>
    </div>

    <div id="welcome" class="toast hidden"></div>

    <script src="./app.js"></script>
  </body>
</html>

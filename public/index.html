<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1d160e" />
    <title>Stone Crusher 3D / 石くだき工場</title>
    <link rel="stylesheet" href="./style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three.module.js",
          "three/addons/controls/OrbitControls.js": "./vendor/OrbitControls.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>

      <header id="hud">
        <div class="money"><span class="coin">¥</span><strong id="money">0</strong></div>
        <div class="rates"><span id="perSec">0</span> /秒　<span class="stone" id="stoneName">小石</span></div>
      </header>

      <div id="hint">ドラッグで回転 ・ 石をタップで砕く</div>

      <section id="shop">
        <button class="item" data-id="tap">
          <span class="ic">🔨</span>
          <span class="info"><b>叩く力 <em id="tap-own">x0</em></b><small>タップの破砕力 +1</small></span>
          <span class="cost">¥<i id="tap-cost">15</i></span>
        </button>
        <button class="item" data-id="auto">
          <span class="ic">⚙️</span>
          <span class="info"><b>自動破砕 <em id="auto-own">x0</em></b><small>自動 +1 /秒</small></span>
          <span class="cost">¥<i id="auto-cost">25</i></span>
        </button>
        <button class="item" data-id="boss">
          <span class="ic">🧑‍🏭</span>
          <span class="info"><b>親方 <em id="boss-own">x0</em></b><small>全産出 ×1.15</small></span>
          <span class="cost">¥<i id="boss-cost">500</i></span>
        </button>
      </section>

      <div id="loading">3D読み込み中…</div>
    </div>

    <script type="module">
      const show = (m) => {
        const l = document.getElementById("loading");
        if (!l) return;
        l.classList.remove("hidden");
        l.style.cssText =
          "position:fixed;inset:0;margin:0;padding:24px;white-space:pre-wrap;word-break:break-word;font:12px/1.5 monospace;color:#ffd9a0;background:#1d160e;z-index:50;overflow:auto;text-align:left";
        l.textContent = "⚠ 読み込みエラー（この文面をそのまま貼ってください）\n\n" + m;
      };
      window.addEventListener(
        "error",
        (e) => {
          if (e && e.target && (e.target.src || e.target.href))
            show("リソース読込失敗: " + (e.target.src || e.target.href));
        },
        true
      );
      try {
        await import("./app.js?v=3d-3");
      } catch (e) {
        show((e && (e.stack || e.message)) || String(e));
      }
    </script>
  </body>
</html>
